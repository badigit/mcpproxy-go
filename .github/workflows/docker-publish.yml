name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: badigit/mcpproxy-go

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          # :latest намеренно НЕ публикуем отсюда.
          # Прод-образ (fat runtime c node+python+stdio-пакетами) собирает
          # badigit/infra-docker → .github/workflows/build-mcpproxy-go.yml
          # и он является единственным писателем :latest. Форк публикует
          # только референс-теги (sha, semver), чтобы их можно было закрепить
          # в compose при необходимости.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Propagate to prod: tell badigit/infra-docker to rebuild :latest from this
      # commit and redeploy to beget-vps. The infra workflow listens for the
      # repository_dispatch type `mcpproxy-core-updated` and uses client_payload.sha
      # as the build ref. Requires a PAT secret with write access to infra-docker —
      # the default GITHUB_TOKEN is scoped to this repo only and cannot dispatch
      # cross-repo. Missing token = warn-and-skip so this step never blocks publish.
      - name: Trigger infra-docker prod deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN not set — skipping prod auto-deploy dispatch. Add the PAT secret to enable automatic propagation to prod."
            exit 0
          fi
          gh api repos/badigit/infra-docker/dispatches \
            -f event_type=mcpproxy-core-updated \
            -f client_payload[sha]="${{ github.sha }}"
          echo "Dispatched mcpproxy-core-updated (sha=${{ github.sha }}) to badigit/infra-docker"
